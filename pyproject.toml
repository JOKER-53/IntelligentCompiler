[project]
name = "intelligent-compiler"
version = "0.1.0"
description = "Multi-language web compiler with optional AI suggestions"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]==0.23.2",
    "pydantic",
    "openai",
    "pyflakes",
    "python-multipart",
    "websockets",
]

[project.optional-dependencies]
test = ["httpx"]

[tool.setuptools]
py-modules = ["app"]
